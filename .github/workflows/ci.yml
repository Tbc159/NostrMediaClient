name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abilita pnpm
        uses: pnpm/action-setup@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      # Armours the traps of ADR 0002: applesauce-factory would duplicate
      # applesauce-core, and a wide range on nostr-tools would duplicate that
      # in turn. It runs first: if it fails, the rest is noise.
      - name: Guardia sulle dipendenze critiche
        run: pnpm guard:deps

      # The app typechecks against the packages' `dist`: on a clean checkout it
      # does not exist, and the typecheck would fail for a reason unrelated to
      # the code. Locally it went unnoticed because the packages were built.
      - name: Compila i pacchetti
        run: pnpm build:packages

      - name: Formattazione
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
