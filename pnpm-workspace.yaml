packages:
  - 'apps/*'
  - 'packages/*'

# esbuild builds its own binary in post-install: pnpm blocks the scripts until
# they are explicitly approved here. Vite and Vitest need it.
allowBuilds:
  esbuild: true

# The applesauce dependencies have to be kept aligned on the same minor.
# See docs/adr/0002-applesauce-6x-and-nostr-tools-pin.md: applesauce-factory is
# stuck at 4.x and must NEVER be added, or there will be two copies of
# applesauce-core.
catalog:
  applesauce-core: 6.2.0
  applesauce-common: 6.2.0
  applesauce-relay: 6.2.1
  applesauce-loaders: 6.2.0
  applesauce-signers: 6.2.2
  applesauce-accounts: 6.2.0
  applesauce-actions: 6.2.0
  applesauce-content: 6.2.0
  # An exact pin: applesauce-core/relay declare "nostr-tools": "~2.19".
  # With ^2.25 you end up with two copies of nostr-tools in the bundle.
  nostr-tools: 2.19.4
  rxjs: ^7.8.2
  zod: ^4.4.3
  dexie: ^4.4.5
